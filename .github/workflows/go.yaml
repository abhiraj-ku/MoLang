name: Go CI

on:
	push:
		branches: [main]
	pull_request:
		branches: [main]

permissions:
	contents: read

jobs:
	build-and-test:
		runs-on: ubuntu-latest

		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Set up Go
				uses: actions/setup-go@v5
				with:
					go-version: '1.23'
					cache: true

			- name: Check formatting
				run: test -z "$(gofmt -l .)"

			- name: Run vet
				run: go vet ./...

			- name: Run tests
				run: go test ./...

			- name: Build
				run: go build ./...
